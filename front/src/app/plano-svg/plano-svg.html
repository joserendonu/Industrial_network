<svg width="500" height="300" style="border:1px solid #ccc;">
  <!-- Plano base -->
  <rect x="10" y="10" width="480" height="280" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  
  <!-- Pieza 1 -->
  <rect x="60" y="60" width="100" height="60" fill="#4caf50" stroke="#333" stroke-width="2"
        (click)="selectPiece('Pieza 1')" [attr.opacity]="selectedPiece === 'Pieza 1' ? 0.7 : 1"/>
  <text x="110" y="95" text-anchor="middle" fill="#fff" font-size="16">Pieza 1</text>
  
  <!-- Pieza 2 -->
  <rect x="200" y="150" width="120" height="80" fill="#2196f3" stroke="#333" stroke-width="2"
        (click)="selectPiece('Pieza 2')" [attr.opacity]="selectedPiece === 'Pieza 2' ? 0.7 : 1"/>
  <text x="260" y="195" text-anchor="middle" fill="#fff" font-size="16">Pieza 2</text>
</svg>
<app-plano-svg></app-plano-svg>
<div *ngIf="selectedPiece" style="margin-top: 16px;">
  <strong>Seleccionaste:</strong> {{selectedPiece}}
</div>
